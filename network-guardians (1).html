<!DOCTYPE html>
<html lang="ar" dir="rtl">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4F7;--surface:#fff;--ink:#0E2A47;--muted:#4D6A80;--teal:#12A594;--sun:#FFC93C;--coral:#E8504A;--line:#C9DCE5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B2E;--surface:#122B45;--ink:#EAF4F7;--muted:#9DB6C8;--line:#264766}}
:root[data-theme="dark"]{--bg:#0A1B2E;--surface:#122B45;--ink:#EAF4F7;--muted:#9DB6C8;--line:#264766}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
#app{--h:170;max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:2rem;font-weight:900;margin:.2em 0}h2{font-size:1.3rem;font-weight:900;margin:.2em 0 .6em}p{margin:.3em 0}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.xp{background:var(--sun);color:#0E2A47;font-weight:900;border-radius:99px;padding:2px 14px}
.banner{border-radius:22px;padding:14px;text-align:center;font-size:2.4rem;letter-spacing:8px;background:linear-gradient(135deg,#12A594,#3D7BFF 55%,#9B5DE5);margin:6px 0 12px}
.map{display:grid;gap:12px;margin-top:14px}
.node{display:flex;gap:14px;align-items:center;text-align:right;width:100%;font:inherit;color:inherit;background:var(--surface);border:3px solid var(--line);border-inline-start:10px solid hsl(var(--h),70%,55%);border-radius:22px;padding:12px;cursor:pointer}
.node:disabled{opacity:.5;cursor:not-allowed}
.node:not(:disabled):hover,.node:focus-visible{border-color:hsl(var(--h),70%,55%);outline:none}
.ico{font-size:2rem;width:60px;height:60px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.node b{display:block}.stars{letter-spacing:2px;color:var(--sun);font-size:1.1rem}
.tag{display:inline-block;direction:ltr;font-size:.72rem;font-weight:700;border-radius:99px;padding:0 10px;background:hsl(var(--h),80%,86%);color:#0E2A47;margin-inline-start:8px;vertical-align:middle}
.node .tag{margin:0 0 2px}

.msg{font-size:1.1rem;font-weight:500}
.row{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:14px;padding:12px;cursor:pointer;background:var(--teal);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,.step:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.fb{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:500}
.ok{background:rgba(18,165,148,.18)}.no{background:rgba(232,80,74,.18)}
input{width:100%;font:inherit;font-size:1.2rem;padding:12px;border-radius:14px;border:3px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.bar{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--coral);transition:width .25s,background .25s}
.chk{list-style:none;padding:0;margin:8px 0}
.step{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--bg);border:3px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}
.step.done{border-color:var(--teal);background:rgba(18,165,148,.18)}.step.wrong{border-color:var(--coral)}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.al{width:26px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--bg);font-weight:700;font-size:.9rem}.al.on{background:var(--coral);color:#fff}.al.back{background:var(--sun);color:#0E2A47}
.lc{display:flex;flex-direction:column;gap:6px;align-items:center}.lc .step{margin:0;width:52px;padding:8px;text-align:center;font-weight:900}.lc input{width:52px;padding:8px;text-align:center;font-weight:900}.lc .step.sel{border-color:var(--coral)}
.bot{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.bub{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:500;flex:1}
.bub.ok{background:rgba(18,165,148,.18);border-color:var(--teal)}.bub.no{background:rgba(232,80,74,.18);border-color:var(--coral)}
.lesson .bub{border-color:hsl(var(--h),70%,65%)}
.lesson .ico{width:48px;height:48px;font-size:1.5rem;background:hsl(var(--h),80%,88%)}
.hero{position:relative;border-radius:22px;padding:18px;text-align:center;font-size:3.6rem;margin:10px 0;overflow:hidden;color:#0E2A47}
.scene{font-size:1.5rem;letter-spacing:8px;margin-top:4px}
.dec{position:absolute;font-size:1.3rem;animation:fl 3s ease-in-out infinite}
.dots{text-align:center}.dt{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block;margin:0 3px}.dt.on{background:hsl(var(--h),70%,50%)}
.pop{animation:pop .3s}.gl{padding:6px 0;border-bottom:1px dashed var(--line)}.gl:last-child{border:0}
.cf{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;animation:fall 2.6s linear forwards}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.pop,.dec{animation:none}.cf{display:none}}
</style>
</head>
